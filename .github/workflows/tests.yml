name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gearan Link protocol tests
        run: python tests/test_gearan_link.py
      - name: Pairing crypto tests
        run: python tests/test_pairing_crypto.py
      - name: Golden vector tests (cross-language)
        run: python tests/test_vectors.py
